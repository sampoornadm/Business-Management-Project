version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # vitest and its plugins (@vitest/coverage-v8, ...) must share a major version, so they
      # always move in one PR. Listed first: a dependency joins the first group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
