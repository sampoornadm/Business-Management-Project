<!doctype html>
<html><body>

     condition rows under it carry the amount in cell cc=3 and the condition type (an input)
     in the last cell. -->

<tr><td cc="1"><span ct="TV">Header</span></td><td cc="3"></td><td cc="11"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="H1" ct="I" value="0.00"></td><td cc="11"><input ct="I" readonly value="Header Bid Inc/Dec %"></td></tr>
<tr><td cc="1"><span ct="TV">Item 1 - 71802001600160 GASKET FOR COOLING PLATE FLANGE</span></td><td cc="3"></td><td cc="11"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="A1" ct="I" value="17.75"></td><td cc="11"><input ct="I" readonly value="Price"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="A2" ct="I" value="9.00"></td><td cc="11"><input ct="I" readonly value="CGST (Ded-ITC) %"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="A3" ct="I" value="9.00"></td><td cc="11"><input ct="I" readonly value="SGST (Ded-ITC) %"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="A4" ct="I" value="0.00"></td><td cc="11"><input ct="I" readonly value="IGST (Ded-ITC) %"></td></tr>
<tr><td cc="1"><span ct="TV">Item 2 - 5550001 SECOND ITEM</span></td><td cc="3"></td><td cc="11"></td></tr>
<tr><td cc="1"></td><td cc="3"><input id="B1" ct="I" value="0.00"></td><td cc="11"><input ct="I" readonly value="Price"></td></tr>
</table>
</body></html>
