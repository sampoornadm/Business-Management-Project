[project]
name = "bmp-hsn-classifier"
version = "0.1.0"
description = "Trains the HSN heading classifier for the Business Management Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "datasets>=5.0.1",
    "accelerate>=1.1.0",
]

[project.optional-dependencies]
# Only needed for the ONNX export step, which runs after training succeeds.
export = [
    "optimum[exporters]>=1.20",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.uv]
# Torch's macOS arm64 wheels carry Metal (MPS) support in the default PyPI build, so no extra index.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
